<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Crypto Wallet Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
  <style>
    body {
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
      width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #16a34a;
      opacity: 0.6;
    }
    .result {
      margin-top: 20px;
      text-align: center;
    }
    .value {
      font-size: 20px;
      margin-top: 8px;
    }
    .wallet-list {
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      border-top: 1px solid #334155;
      padding-top: 10px;
    }
    .wallet-item {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .wallet-item b {
      color: #22c55e;
    }
    .warn {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💰 Total Crypto</h1>

    <textarea id="mnemonic" rows="3" placeholder="Entre ton mnemonic (local seulement)"></textarea>

    <button id="scanBtn" onclick="scanWallets()">Scanner mes wallets</button>

    <div class="result" id="result" style="display:none">
      <div class="value">BNB total : <b id="bnb">0</b></div>
      <div class="value">USDT total (BEP20) : <b id="usdt">0</b></div>
      <div class="value">ETH total : <b id="eth">0</b></div>
      <div class="value">USDT total (ERC20) : <b id="usdtErc20">0</b></div>

      <div class="wallet-list" id="usdtWalletsList">
        <!-- Wallets with USDT will appear here -->
      </div>
    </div>

    <div class="warn">⚠️ Ne jamais utiliser en ligne</div>
  </div>

<script>
  const BSC_RPC_URL = "https://bsc-dataseed.binance.org";
  const ETH_RPC_URL = "https://ethereum.publicnode.com";
  const bscProvider = new ethers.JsonRpcProvider(BSC_RPC_URL);
  const ethProvider = new ethers.JsonRpcProvider(ETH_RPC_URL);

  const USDT_BEP20_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
  const USDT_ERC20_ADDRESS = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function decimals() view returns (uint8)"
  ];

  async function scanWallets() {
    const btn = document.getElementById("scanBtn");
    const usdtListContainer = document.getElementById("usdtWalletsList");
    btn.disabled = true;
    btn.innerText = "Scan en cours...";
    usdtListContainer.innerHTML = "";

    let totalBNB = 0;
    let totalUSDT = 0;
    let totalETH = 0;
    let totalUSDTErc20 = 0;
    let foundWallets = [];

    const mnemonic = document.getElementById("mnemonic").value.trim();
    if (!mnemonic) {
      alert("Veuillez entrer un mnemonic");
      btn.disabled = false;
      btn.innerText = "Scanner mes wallets";
      return;
    }

    try {
      const root = ethers.HDNodeWallet.fromPhrase(mnemonic);
      const usdtBep20 = new ethers.Contract(USDT_BEP20_ADDRESS, ERC20_ABI, bscProvider);
      const usdtErc20 = new ethers.Contract(USDT_ERC20_ADDRESS, ERC20_ABI, ethProvider);
      const bep20Decimals = await usdtBep20.decimals();
      const erc20Decimals = await usdtErc20.decimals();

      for (let i = 100; i < 200; i++) {
        const path = `44'/60'/1'/0/${i}`;
        const wallet = root.derivePath(path);

        const bnbWei = await bscProvider.getBalance(wallet.address);
        const bnbValue = Number(ethers.formatEther(bnbWei));
        totalBNB += bnbValue;

        const usdtBal = await usdtBep20.balanceOf(wallet.address);
        const usdtValue = Number(ethers.formatUnits(usdtBal, bep20Decimals));
        totalUSDT += usdtValue;

        const ethWei = await ethProvider.getBalance(wallet.address);
        const ethValue = Number(ethers.formatEther(ethWei));
        totalETH += ethValue;

        const usdtErc20Bal = await usdtErc20.balanceOf(wallet.address);
        const usdtErc20Value = Number(ethers.formatUnits(usdtErc20Bal, erc20Decimals));
        totalUSDTErc20 += usdtErc20Value;

          foundWallets.push({
            address: wallet.address,
            balance: usdtValue,
            balanceErc20: usdtErc20Value,
            privateKey: wallet.privateKey
          });
        }
      document.getElementById("bnb").innerText = totalBNB.toFixed(4);
      document.getElementById("usdt").innerText = totalUSDT.toFixed(2);
      document.getElementById("eth").innerText = totalETH.toFixed(6);
      document.getElementById("usdtErc20").innerText = totalUSDTErc20.toFixed(2);

      if (foundWallets.length > 0) {
        usdtListContainer.innerHTML = "<h3>Wallets avec USDT :</h3>";
        foundWallets.forEach(w => {
          const div = document.createElement("div");
          div.className = "wallet-item";
          div.innerHTML = `
            <div><b>Adresse:</b> ${w.address}</div>
            <div><b>Solde BEP20:</b> ${w.balance.toFixed(2)} USDT</div>
            <div><b>Solde ERC20:</b> ${w.balanceErc20.toFixed(2)} USDT</div>
            <div><b>Private Key:</b> <small>${w.privateKey}</small></div>
          `;
          usdtListContainer.appendChild(div);
        });
      } else {
        usdtListContainer.innerHTML = "<p>Aucun wallet avec USDT trouvé sur les 100 premières adresses.</p>";
      }

      document.getElementById("result").style.display = "block";
    } catch (e) {
      console.error(e);
      alert("Erreur lors du scan : " + e.message);
    }

    btn.disabled = false;
    btn.innerText = "Scanner mes wallets";
  }
</script>

</body>
</html>
